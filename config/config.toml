[soul_ring]
# Master toggle for Soul Ring automation
enabled = true
# Only trigger Soul Ring if mana percent is below this threshold
min_mana_percent = 100
# Safety threshold - don't use Soul Ring if health percent is at or below this (avoid suicide)
min_health_percent = 20
# Delay in milliseconds between Soul Ring press and ability press
delay_before_ability_ms = 30
# Cooldown lockout in milliseconds to prevent double-fire on double-tap
trigger_cooldown_ms = 10
# Ability keys to intercept for Soul Ring triggering
ability_keys = ["q", "w", "e", "r", "d", "f"]
# Also trigger Soul Ring before item key presses (items that cost mana)
intercept_item_keys = true

[minimap_analysis]
enabled = false
baseline_frames = 10
baseline_threshold = 0.8
min_cluster_size = 20
max_cluster_size = 200
red_hue_max = 15.0
red_hue_min_wrap = 340.0
red_min_saturation = 40.0
red_min_value = 30.0
green_hue_min = 80.0
green_hue_max = 160.0
green_min_saturation = 35.0
green_min_value = 25.0

[hud]
# Points on Dota's own HUD that automation clicks.
#
# Some abilities cannot be self-cast -- Dota aims them at the cursor -- so the
# only way to land one on your own hero is to click the hero portrait, which
# Dota resolves as a click on the hero. That needs a screen coordinate nobody
# can derive, so it is measured once.
#
# Positions are fractions of Dota's CLIENT RECT, not the display, so they
# survive moving the window, changing resolution, and a second monitor.
#
# Do not edit these by hand: hover the centre of the hero portrait in game and
# press capture_portrait_key, or use Settings -> HUD Anchors -> Capture Now.
portrait_x_fraction = 0.44
portrait_y_fraction = 0.90
# Whether the values above were actually measured. Nothing may click the
# portrait until this is true, so a guessed coordinate can never turn into a
# stray move order. Capture sets it.
portrait_calibrated = false
# Hotkey that records the cursor position as the portrait anchor. Blocked from
# reaching Dota while the app is running, so pick a key Dota does not need.
capture_portrait_key = "F9"
