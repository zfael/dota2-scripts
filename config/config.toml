[server]
port = 3000

# Auto-update settings
[updates]
# Check for updates when the application starts
check_on_startup = true
# Include pre-release versions (RC, alpha, beta)
include_prereleases = false

[keybindings]
slot0 = "z"
slot1 = "x"
slot2 = "c"
slot3 = "v"
slot4 = "b"
slot5 = "n"
neutral0 = "0"
combo_trigger = "Home"

[logging]
level = "info"
# Also write a log file to %LOCALAPPDATA%\dota2-scripts\logs\, rotated daily.
# The desktop build is a GUI process with nowhere for console output to go, so
# this file is the only record of what the app did. Read once at startup --
# changing it needs a restart.
file_enabled = true

[rune_alerts]
enabled = true
alert_lead_seconds = 10
interval_seconds = 120
audio_enabled = true

# Creep wave prediction calibration. The meet_* values are empirical
# approximations — retune them here rather than in code.
[wave_tracker]
enabled = true
mid_meet_seconds = 17.0
mid_meet_progress = 0.5
side_meet_seconds = 28.0
top_meet_progress = 0.42
bottom_meet_progress = 0.58
confidence_high_seconds = 600
confidence_degrading_seconds = 900

# Scheduled objective audio alerts. Cues are generated in-app, so no sound
# files are needed; set sound_file on an event to override it with your own.
[alerts]
enabled = true
master_volume = 0.8
# Voice pack directory under assets/voice/. Empty uses the generated cues.
# Create one with scripts/generate-voice-pack.ps1.
voice_pack = ""

[alerts.power_rune]
enabled = true
lead_seconds = 15
volume = 1.0
sound_file = ""

[alerts.wisdom_rune]
enabled = true
lead_seconds = 20
volume = 1.0
sound_file = ""

[alerts.water_rune]
enabled = true
lead_seconds = 15
volume = 1.0
sound_file = ""

[alerts.bounty_rune]
enabled = true
lead_seconds = 15
volume = 1.0
sound_file = ""

# Off by default: only relevant to some roles.
[alerts.tormentor]
enabled = false
lead_seconds = 30
volume = 1.0
sound_file = ""

[alerts.neutral_item]
enabled = true
lead_seconds = 10
volume = 1.0
sound_file = ""

# Off by default: this one fires every single minute.
[alerts.stack]
enabled = false
lead_seconds = 5
volume = 1.0
sound_file = ""

# Click-through overlay drawn over Dota's in-game minimap.
# Placement comes from [minimap_capture] minimap_x/y/width/height plus the
# offsets below. Requires Dota in Borderless or Windowed mode.
[wave_overlay]
enabled = false
toggle_key = "F8"
offset_x = 0
offset_y = 0
opacity = 0.85
# Dota's minimap already draws the lanes and river underneath, so the dots alone
# read more cleanly. The in-app panel keeps its lines regardless.
show_lane_lines = false
# Where map space sits inside the overlay window. The window covers the whole
# minimap panel, but the map texture is inset inside its bezel — offsets are
# fractions of the window (Y positive downward), scales are applied about the
# centre. Measured on 2560x1440 borderless; retune via Wave Tracker >
# Minimap Overlay > Calibration Mode if the lanes look off on your setup.
map_offset_x = -0.020
map_offset_y = 0.015
map_scale_x = 0.993
map_scale_y = 0.929
# Draws the map-space box and forces the lane lines on while aligning.
calibrating = false

# Draft-phase hero identification. Reads the pick strip off the screen while
# GSI reports hero selection, and feeds the Draft page. Capture happens ONLY
# during DOTA_GAMERULES_STATE_HERO_SELECTION / STRATEGY_TIME — verified to stay
# silent in menus and in-game.
[draft]
enabled = false
# Capture cadence while a draft is on screen. A strip capture costs ~14ms.
poll_ms = 1000
# Save strip PNGs + per-frame read logs, one directory per draft, for offline
# evaluation. This is what turns ranked games into test data.
telemetry_enabled = true
telemetry_dir = "logs/draft_telemetry"
# Keep every Nth frame's PNG (the JSONL records every frame regardless).
telemetry_save_every_n = 5
# Save portraits the matcher cannot identify (arcanas, personas) as exemplars,
# labelled by GSI. They join the reference pool from the next draft on.
harvest_enabled = true
exemplar_dir = "draft_exemplars"

# STRATZ-backed draft advice: counters, synergy and position fit for the role
# you are queuing. Set up from the Draft page — enable the reader, then paste
# your own token.
[stratz]
enabled = false
# Leave empty and set the STRATZ_TOKEN environment variable instead to keep the
# credential off disk. Get one free at stratz.com/api (Steam login -> My
# Tokens). The token is bound to your account and rate-limited per token, so
# each user needs their own.
api_token = ""
# Rank bracket the statistics describe: DIVINE_IMMORTAL, LEGEND_ANCIENT,
# CRUSADER_ARCHON, HERALD_GUARDIAN.
bracket = "DIVINE_IMMORTAL"
cache_path = "stratz/dataset.bin"
# Matchup data is a per-patch aggregate; a day between refreshes is generous.
# A refresh is ~132 requests and takes about a minute at the free rate limit.
cache_ttl_hours = 24
# Position 1-5 you are queuing for; 0 applies no role filter. Normally set
# from the Draft page rather than here.
position = 0
# Suggest only commonly picked heroes: those picked at least 1.5x as often as
# the average hero, which is about 25 of 127 overall and 23-31 per role. Off by
# default — the sharpest counter to a lineup is often an unpopular hero.
# Normally toggled from the Draft page.
meta_only = false
# Matchup sample size trusted at half weight: a matchup contributes
# matches/(matches+shrink_k). Without this a 3-game 100% matchup outranks a
# 4000-game 54% one.
shrink_k = 50.0
# How much a hero's own strength counts next to matchup effects. Kept low on
# purpose — the point is the matchup, not the tier list.
base_weight = 0.4
synergy_weight = 1.0
suggestion_count = 12

[minimap_capture]
enabled = false
minimap_x = 2
minimap_y = 835
minimap_width = 240
minimap_height = 245
capture_interval_ms = 1000
sample_every_n = 30
artifact_output_dir = "logs/minimap_capture"

[common]
survivability_hp_threshold = 30
lane_phase_duration_seconds = 480
lane_phase_healing_threshold = 12

[armlet]
enabled = true
cast_modifier = "Alt"
toggle_threshold = 320
predictive_offset = 30
toggle_cooldown_ms = 250

[armlet.roshan]
enabled = false
toggle_key = "Insert"
emergency_margin_hp = 60
learning_window_ms = 5000
min_confidence_hits = 2
min_sample_damage = 80
stale_reset_ms = 6000

[heroes.huskar]
berserker_blood_key = "e"
berserker_blood_delay_ms = 300
standalone_key = "Home"

[heroes.huskar.armlet]
toggle_threshold = 120
predictive_offset = 150
toggle_cooldown_ms = 300

[heroes.huskar.roshan_spears]
enabled = false
burning_spear_key = "w"
disable_buffer_hp = 60
reenable_buffer_hp = 100

[heroes.legion_commander]
standalone_key = "Home"

[heroes.shadow_fiend]
# Enable raze interception (ALT + right-click before Q/W/E)
raze_intercept_enabled = true
# Delay between right-click and raze key press (ms)
raze_delay_ms = 10
# Automatically use BKB before ultimate (Requiem of Souls) when pressing R
# Sequence: BKB (double-tap) → D (if enabled) → R
auto_bkb_on_ultimate = true
# Automatically press D (Aghanim's ability) before ultimate
auto_d_on_ultimate = true
# Standalone combo key: Blink + Ultimate (only executes if Blink is off cooldown)
# Sequence: Blink → BKB (if enabled) → D (if enabled) → R
standalone_key = "Home"

[heroes.tiny]
standalone_key = "Home"

[heroes.outworld_destroyer]
standalone_key = "Home"
objurgation_key = "e"
arcane_orb_key = "q"
astral_imprisonment_key = "w"
auto_objurgation_on_danger = true
objurgation_hp_threshold_percent = 55
objurgation_min_mana_percent = 25
objurgation_trigger_cooldown_ms = 1500
ultimate_intercept_enabled = true
auto_bkb_on_ultimate = true
auto_objurgation_on_ultimate = true
post_bkb_delay_ms = 50
post_blink_delay_ms = 100
astral_self_cast_enabled = false
astral_self_cast_key = "F5"
combo_items = ["sheepstick", "bloodthorn"]
combo_item_spam_count = 1
combo_item_delay_ms = 50
post_ultimate_arcane_orb_presses = 0
arcane_orb_press_interval_ms = 30

[danger_detection]
enabled = true
hp_threshold_percent = 70
rapid_loss_hp = 100
time_window_ms = 500
clear_delay_seconds = 3
healing_threshold_in_danger = 50
max_healing_items_per_danger = 3
auto_bkb = false
auto_satanic = true
satanic_hp_threshold = 40
auto_blade_mail = true
# Static Charge, self-cast by double-tapping the slot key
auto_mjollnir = true
auto_glimmer_cape = true
auto_ghost_scepter = true
auto_shivas_guard = true
# Auto-use Manta Style when silenced (independent of danger detection)
auto_manta_on_silence = true
# Auto-use Lotus Orb when silenced (self-cast, independent of danger detection)
auto_lotus_on_silence = true

[neutral_items]
enabled = true
self_cast_key = "0"
log_discoveries = false
use_in_danger = true
hp_threshold = 50
allowed_items = [
    "item_essence_ring",
    "item_minotaur_horn",
    "item_metamorphic_mandible",
    "item_jidi_pollen_bag",
    "item_ash_legion_shield",
    "item_idol_of_screeauk",
    "item_kobold_cup",
    "item_crippling_crossbow"
]

[mana_automation]
enabled = true
mana_threshold_percent = 25
excluded_heroes = ["npc_dota_hero_huskar"]
allowed_items = [
    "item_arcane_boots",
    "item_mana_draught",
]

[phase_boots_automation]
enabled = true
minimum_distance_units = 100
excluded_heroes = []

[invisibility]
# Hold every automation that would break Shadow Blade / Silver Edge invisibility:
# Dark Pact, Phase Boots, healing, defensive, neutral and mana items, and the
# Manta/Lotus silence dispel. Abilities that grant invisibility instead of ending
# it — Slark's Shadow Dance and Depth Shroud — are never held. Neither are Soul
# Ring or Armlet: those fire off your own keypress or to stop you dying.
suppress_automation = true

[heroes.largo]
amphibian_rhapsody_enabled = true
auto_toggle_on_danger = true
mana_threshold_percent = 20  # Auto-disable ultimate below this mana
heal_hp_threshold = 50  # Switch to Island Elixir when HP below this
beat_interval_ms = 995  # Beat timing in milliseconds (990-1000)
beat_correction_ms = 30  # Correction to apply every N beats (negative = speed up, positive = slow down)
beat_correction_every_n_beats = 5  # Apply correction every N beats (0 = disabled)
q_ability_key = "q"  # Bullbelly Blitz (damage)
w_ability_key = "w"  # Hotfeet Hustle (movement)
e_ability_key = "e"  # Island Elixir (healing)
r_ability_key = "r"  # Amphibian Rhapsody toggle
standalone_key = "Home"  # Manual ultimate activation

[heroes.broodmother]
# Spider micro: Middle Mouse triggers select spiders → right-click → reselect hero
spider_micro_enabled = true
spider_control_group_key = "F3"  # Use "Select All Other Units" hotkey (bind in Dota 2 settings)
reselect_hero_key = "1"          # Key to reselect hero after command
attack_key = "a"                 # Not used (right-click move instead)
# Auto-items: Hold modifier + right-click to use items then attack
auto_items_enabled = true
auto_items_modifier = "Space"    # Hold this key + right-click
auto_items = ["orchid", "bloodthorn", "diffusal", "disperser", "nullifier", "abyssal_blade"]
# Auto-abilities: Cast abilities during Space+Right-click combo
# Each entry: index (ability0-5), key to press, optional hp_threshold (only cast if HP% below)
# Broodmother abilities: 0=Insatiable Hunger(Q), 1=Spin Web(W), 2=Incapacitating Bite(E), 
#                        3=Spider's Milk(D), 4=Spawn Spiderlings(R-ult)
auto_abilities = [
    { index = 0, key = "q", hp_threshold = 80 },  # Insatiable Hunger when HP < 80%
    { index = 4, key = "r" },                      # Spawn Spiderlings (ultimate) - always
]
# Execution order: false = items first (default), true = abilities first
auto_abilities_first = false

[heroes.meepo]
standalone_key = "Home"
earthbind_key = "q"
poof_key = "w"
dig_key = "d"
megameepo_key = "f"
post_blink_delay_ms = 80
combo_items = ["sheepstick", "disperser"]
combo_item_spam_count = 1
combo_item_delay_ms = 40
earthbind_press_count = 2
earthbind_press_interval_ms = 30
poof_press_count = 3
poof_press_interval_ms = 35
auto_dig_on_danger = true
dig_hp_threshold_percent = 32
auto_megameepo_on_danger = true
megameepo_hp_threshold_percent = 45
defensive_trigger_cooldown_ms = 1500

[heroes.meepo.farm_assist]
enabled = true
toggle_key = "End"
pulse_interval_ms = 700
minimum_mana_percent = 35
minimum_health_percent = 45
right_click_after_poof = true
suspend_on_danger = true
suspend_after_manual_combo_ms = 2500
poof_press_count = 1
poof_press_interval_ms = 35

[heroes.snapfire]
# Press the trigger key to face the cursor and self-cast Firesnap Cookie (leap toward cursor).
# W stays free for manually cookie-ing allies.
enabled = true
# Key intercepted to start the combo.
trigger_key = "Space"
# Firesnap Cookie ability key (self-cast via ALT).
cookie_key = "w"
# Delay after the facing right-click before the self-cast leap (ms). Increase if the leap fires before the hero finishes turning.
turn_delay_ms = 60

[heroes.magnus]
# Press R to face the cursor and then cast Reverse Polarity, so enemies are
# dragged to the arc you are pointing at and Skewer lines up behind them.
enabled = true
# Reverse Polarity ability key. This is also the key that gets intercepted.
ultimate_key = "r"
# Delay after the facing right-click before the ultimate cast (ms). Increase if
# Reverse Polarity fires before Magnus finishes turning.
turn_delay_ms = 60
# Only intercept when Reverse Polarity is levelled and off cooldown. Leave true:
# it stops a cooldown press from issuing the facing right-click and walking
# Magnus toward the cursor for nothing.
require_ability_ready = true
# After the cast, double-tap the hero-select key so the camera snaps back to
# Magnus and Skewer is easy to aim. Set false to leave the camera alone.
center_camera_on_ultimate = true
# Hero-select key to double-tap. Accepts a character ("1") or a named key ("F1").
# Must match your in-game hero-select binding.
camera_center_key = "1"
# Delay between the ultimate cast and the first camera tap (ms).
camera_center_delay_ms = 60

[heroes.mirana]
# Press E to face the cursor and then cast Leap, so the leap goes where you are
# pointing instead of wherever Mirana happened to be facing.
enabled = true
# Leap ability key. This is also the key that gets intercepted.
leap_key = "e"
# Delay after the facing right-click before the Leap cast (ms). Increase if Leap
# fires before Mirana finishes turning.
turn_delay_ms = 200
# Only intercept when Leap is levelled and off cooldown. Leave true: it stops a
# cooldown press from issuing the facing right-click and walking Mirana toward
# the cursor for nothing. Leap is charge-based, so if you see the intercept
# skipped while Leap is visibly castable, set this false and report it.
require_ability_ready = true

[heroes.ember_spirit]
# One combo-key press drops a Fire Remnant and immediately dashes to it, so
# chasing costs one key instead of two. Fired by the global combo trigger key
# (Settings -> Trigger Key, default Home) while Ember Spirit is the active hero.
enabled = true
# Fire Remnant ability key, pressed first. This assumes quickcast is ON for it:
# without quickcast the press only arms the cursor, and the no-target activate
# that follows cancels the targeting instead of placing the remnant.
remnant_key = "r"
# Activate Fire Remnant key, pressed second. This is the sub-ability that dashes
# to every remnant on the map.
activate_key = "d"
# Delay between the two presses (ms). The remnant has to exist server-side
# before the activate can pick it up. Raise it if the dash skips the remnant you
# just placed; lower it if the chase feels sluggish.
activate_delay_ms = 150
# Use the shorter delay below while Ember holds an Aghanim's Scepter, which
# places the remnant instantly. Set to false to keep the delay above regardless
# of scepter.
use_scepter_activate_delay = true
# Delay between the two presses (ms) while Ember holds an Aghanim's Scepter.
# Shorter than the plain delay because the remnant no longer has to travel, but
# not zero: the activate still has to land after the remnant registers
# server-side. Raise it if the scepter chase dashes without placing.
scepter_activate_delay_ms = 40
# Cast Flame Guard automatically when the danger detector trips and HP is at or
# below the threshold. Independent of `enabled` above, which only gates the
# remnant chase.
auto_flame_guard_on_danger = true
# Flame Guard ability key pressed by the auto-cast.
flame_guard_key = "e"
# Only auto-cast at or below this health percentage. Higher than the other
# danger thresholds in this file on purpose: Flame Guard is a damage shield, so
# its value comes from being up before the burst lands.
flame_guard_hp_threshold_percent = 65
# Minimum gap between two auto-casts (ms), so a burst of GSI payloads cannot
# spam the key.
flame_guard_trigger_cooldown_ms = 2000

[heroes.slark]
# Press W to face the cursor and then cast Pounce, so the leap goes where you
# are pointing instead of wherever Slark happened to be facing.
enabled = true
# Pounce ability key. This is also the key that gets intercepted.
pounce_key = "w"
# Delay after the facing right-click before the Pounce cast (ms). Increase if
# Pounce fires before Slark finishes turning.
turn_delay_ms = 200
# Only intercept when Pounce is levelled and off cooldown. Leave true: it stops
# a cooldown press from issuing the facing right-click and walking Slark toward
# the cursor for nothing.
require_ability_ready = true
# Cast Dark Pact automatically whenever GSI reports a debuff on Slark. GSI only
# exposes a single has_debuff flag and never says which modifier landed, so this
# fires on trivial debuffs too — turn it off if you would rather keep Dark Pact
# for farming.
auto_dark_pact_on_debuff = true
# Dark Pact ability key. Must match your in-game binding.
dark_pact_key = "q"
# Settle window after the first debuff before casting (ms), so a burst of
# debuffs from one engagement is cleansed by a single Dark Pact.
dark_pact_delay_ms = 300
# Also require the danger detector, not just has_debuff. Leave true: a creep's
# slow sets the same flag a Doom does, so without this the cleanse gets spent on
# chip damage while farming at full HP.
dark_pact_require_danger = true
# Spend Shadow Dance to survive when Slark drops low.
auto_shadow_dance_on_low_hp = true
# Shadow Dance ability key.
shadow_dance_key = "r"
# HP percentage at or below which the escape fires.
shadow_dance_hp_threshold_percent = 35
# Also require the danger detector, not just the HP line. Leave true: it reads
# as "low AND actually under fire", so limping home at 30% never spends the ult.
shadow_dance_require_danger = true
# Minimum gap between two escape attempts (ms).
shadow_dance_trigger_cooldown_ms = 3000
# How long Shadow Dance stays active after a cast (ms). The shard fallback is
# held for this long afterwards so the two do not pop on the same moment --
# while the ultimate is running it is already doing the job. This is its level-1
# duration; raise it to 5000 / 6000 as the ultimate levels up. Counts casts you
# make yourself too, not just the automation's.
shadow_dance_active_ms = 4000
# When Shadow Dance is on cooldown, fall back to Depth Shroud (the shard
# ability). Dota will not self-cast it, so this presses the key and clicks where
# your cursor already is -- the mouse is never moved. The shroud therefore lands
# at the cursor, not centred on Slark.
shard_fallback_enabled = true
# Key Depth Shroud sits on. Only the key is configurable: readiness is checked by
# matching slark_depth_shroud by name, because GSI reports abilities in ability
# order rather than key order (the shard ability sits ahead of the ultimate).
shard_key = "d"

[heroes.earth_spirit]
# Earth Spirit has no silence button and no long roll button. Both are a Stone
# Remnant plus one more ability aimed at the same cursor position, so each is
# remapped onto its second key: press the grip key and you get remnant-then-grip,
# press the roll key and you get remnant-then-roll.
enabled = true
# Stone Remnant key, pressed first by both combos. This assumes quickcast is ON
# for it: without quickcast the press only arms the cursor, and the second key
# cancels the targeting instead of placing the remnant.
remnant_key = "d"
# --- Silence combo (Geomagnetic Grip) ---
# Grip pulls the remnant back toward Earth Spirit and silences everything it
# passes through. Aim PAST the target, not at it — the silence lands on whoever
# stands between your cursor and you.
silence_combo_enabled = true
# Geomagnetic Grip key. This is also the key that gets intercepted. Assumes
# quickcast, same as the remnant key.
grip_key = "e"
# Delay between the remnant press and the grip press (ms). The remnant has to
# exist server-side before the grip resolves. Raise it if the grip reaches for
# an older remnant, or for nothing at all.
silence_remnant_delay_ms = 120
# Only intercept when Geomagnetic Grip is levelled and off cooldown. Leave true:
# it stops a cooldown press from spending a remnant charge on a grip that cannot
# fire. Deliberately does not check Stone Remnant — that ability is charge-based
# and GSI's can_cast is unreliable for charges, so gating on it would kill the
# intercept while remnants are visibly banked.
require_grip_ready = true
# --- Roll combo (Rolling Boulder) ---
# A roll that passes through a remnant travels 1600 units instead of 800 and
# moves much faster, so the good roll is always the two-key one.
#
# This combo fires the ROLL FIRST, then the remnant -- the opposite order to the
# silence above. Rolling Boulder has a ~600ms windup before Earth Spirit starts
# moving, and a remnant dropped into the path during that window still counts.
#
# The remnant is SELF-CAST, which is what makes this combo need no aiming at
# all: self-cast drops the stone on Earth Spirit, and the roll starts from Earth
# Spirit, so the boulder passes through it every time no matter where your
# cursor is. Cast the roll to pick the direction; the stone takes care of itself.
roll_combo_enabled = true
# Rolling Boulder key. This is also the key that gets intercepted.
roll_key = "w"
# Press the roll key twice. Rolling Boulder is the one ability commonly left off
# quickcast, where the first press only arms the cursor and a second press fires
# it. Turn this off if you enable quickcast for the roll key, or if the second
# tap cancels the targeting instead of casting.
roll_double_tap = true
# Gap between the two roll presses (ms). Ignored when roll_double_tap is false.
roll_double_tap_delay_ms = 60
# Gap between the roll firing and the remnant press (ms). Measured from the
# press that actually casts the roll, so from the second tap when
# roll_double_tap is on. With the remnant self-cast there is nothing to aim, so
# this only has to clear the roll press -- sooner is better, since the stone
# wants to exist before the boulder leaves its own starting position.
roll_to_remnant_delay_ms = 120
# --- Self-casting the remnant ---
# Two independent routes to self-cast, because which one works depends on your
# Dota settings. Both ship on; leave both on unless one misbehaves.
#
# Hold ALT across the remnant press. This is Dota's self-cast modifier, and it
# is the route that still works when the remnant key is on quickcast (quickcast
# fires on key-down, so a plain double-tap just places two stones at the cursor).
#
# NOTE: if your Dota is set to alt-ping abilities rather than self-cast them,
# this will PING Stone Remnant to your team instead of placing it. If you see a
# ping, turn this off and rely on the double-tap below.
roll_remnant_alt = true
# Press the remnant key twice -- Dota's default self-cast binding.
roll_remnant_double_tap = true
# Gap between the two remnant presses (ms). Ignored when the above is false.
roll_remnant_double_tap_delay_ms = 60
# Turning BOTH self-cast options off puts the remnant back at your cursor, which
# then needs real aiming time: raise roll_to_remnant_delay_ms to ~300 if you do.
#
# Whatever you set, keep the delays in this section summing to well under the
# ~600ms windup. Past it the boulder is already rolling and a remnant placed
# behind it does nothing, which looks exactly like the combo firing and having
# no effect.
# Only intercept when Rolling Boulder is levelled and off cooldown.
require_roll_ready = true
# --- Scepter escape (Enchant Remnant + Boulder Smash) ---
# With an Aghanim's Scepter, Earth Spirit gains Enchant Remnant. Self-cast, it
# turns HIM into a Stone Remnant -- untargetable, which is the save -- and a
# remnant is a legal Boulder Smash target, so the kick that follows launches him
# out of whatever was killing him.
#
# This is a survivability feature, not a combo: it is NOT gated by `enabled`
# above, and it fires off GSI rather than off a key. Without a scepter, Enchant
# Remnant is not in the payload at all and nothing here ever runs.
auto_petrify_on_danger = true
# Enchant Remnant key -- the scepter ability slot, not one of the four base
# abilities.
petrify_key = "f"
# Only fire at or below this health percentage. Deliberately well under the
# [danger_detection] hp_threshold_percent: this is the last resort, and it takes
# Earth Spirit out of the fight entirely, so it must not pre-empt the cheaper
# defensive items.
petrify_hp_threshold_percent = 22
# Minimum gap between two escapes (ms). Longer than the other auto-casts on
# purpose: Earth Spirit stays petrified for several seconds after a successful
# cast, and GSI keeps reporting the low HP that triggered it the whole time.
petrify_trigger_cooldown_ms = 5000
# Self-casting the petrify is what makes the remnant BE Earth Spirit. Same two
# independent routes as the roll combo's remnant, for the same reason: which one
# works depends on your Dota settings. Turning BOTH off does not disable the
# escape -- it petrifies whoever your cursor was over instead, which is a
# completely different spell.
petrify_alt = true
petrify_double_tap = true
# Gap between the two Enchant Remnant presses (ms). Ignored when the above is
# false.
petrify_double_tap_delay_ms = 60
# Follow the petrify with a Boulder Smash to kick the remnant -- you -- clear.
# Turn this off to petrify in place and just wait the duration out.
petrify_smash_enabled = true
# Boulder Smash key. Pressed once, plain: not self-cast and not aimed, because
# the nearest remnant after the petrify is Earth Spirit himself. This key is
# never intercepted.
smash_key = "q"
# Gap between the petrify and the kick (ms). Longer than the combo delays for a
# different reason than they are: this one waits on a CAST resolving, not on a
# key press clearing. There is nothing to kick until the petrify has actually
# turned him to stone.
petrify_to_smash_delay_ms = 250

